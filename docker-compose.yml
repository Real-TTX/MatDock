# MatDock – as simple as possible: the app and its data volume.
#   docker compose up -d --build
name: matdock

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        Channel: local
    image: matdock:local
    ports:
      - "4455:4455"
    volumes:
      - data:/data
      # The Docker of this host as a "local" environment; leave it out for SSH environments only.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  data:
