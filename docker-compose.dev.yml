# MatDock – dev override. Adds a lightweight SQLite web viewer (instead of pgAdmin) on the data volume.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# App:        http://localhost:4455
# SQLite web: http://localhost:8085
services:
  matdock:
    environment:
      # Development => es wird automatisch ein Test-Konto angelegt (tester / Tester123!).
      ASPNETCORE_ENVIRONMENT: Development
    # Lokaler Docker-Socket, damit "Lokal"-Environments den Host-Daemon steuern koennen.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: matdock-sqlite-web
    depends_on:
      - matdock
    ports:
      - "8085:8080"
    environment:
      SQLITE_DATABASE: /data/matdock.db
    volumes:
      - matdock-data:/data
    restart: unless-stopped

volumes:
  matdock-data:
