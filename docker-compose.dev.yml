# MatDock – dev stack: the image in Development mode (a test account tester / Tester123! is created) and a SQLite web viewer on the data volume.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# App:        http://localhost:4455
# SQLite web: http://localhost:8085
name: matdock

services:
  web:
    build:
      args:
        AspNetEnvironment: Development

  sqlite-web:
    image: coleifer/sqlite-web:latest
    depends_on:
      - web
    ports:
      - "8085:8080"
    command: ["sqlite_web", "-H", "0.0.0.0", "-x", "/data/matdock.db"]
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
