<!doctype html>
<html lang="en" data-app="matdock">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d78be" />
    <title>Offline · MatDock</title>
    <script src="/matui/matui.boot.js"></script>
    <link rel="stylesheet" href="/matui/matui.css" />
</head>
<body>
    <main class="mat-auth">
        <div class="mat-auth__card">
            <div class="mat-empty">
                <span class="mat-logo mat-logo--lg" role="img" aria-label="MatDock"><img src="/img/logo.svg" alt="" /></span>
                <h1 class="mat-empty__title">You're offline</h1>
                <p>MatDock can't reach the server right now. Check your connection, then try again.</p>
                <a class="mat-btn mat-btn--primary" href="/">Try again</a>
            </div>
        </div>
    </main>
</body>
</html>
